<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>受講生一覧</title>
</head>
<body>
<h1>受講生一覧</h1>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>名前</th>
        <th>カナ名</th>
        <th>ニックネーム</th>
        <th>メールアドレス</th>
        <th>地域</th>
        <th>年齢</th>
        <th>性別</th>
        <th>備考</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="studentDetail : ${studentList}">
        <td th:text="${studentDetail.student.id}">1</td>
        <td>
            <a th:href="@{/updateStudent/{id}(id=${studentDetail.student.id})}"
        th:text="${studentDetail.student.name}"></a>
        </td>
        <td th:text="${studentDetail.student.kana}">ヤマダタロウ</td>
        <td th:text="${studentDetail.student.nickname}">タロ</td>
        <td th:text="${studentDetail.student.mailaddress}">taro@example.com</td>
        <td th:text="${studentDetail.student.tiiki}">東京</td>
        <td th:text="${studentDetail.student.age}">20</td>
        <td th:text="${studentDetail.student.gender}">male</td>
        <td th:text="${studentDetail.student.remark}">特になし</td>
    </tr>
    </tbody>
</table>
</body>
</html>
