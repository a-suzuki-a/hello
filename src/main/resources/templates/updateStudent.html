<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>受講生更新</title>

</head>
<body>
<h1>受講生更新</h1>
<form th:action="@{/updateStudent}" th:object="${studentDetail}" method="post">
    <input type="hidden" th:field="*{student.id}"/>

    <div>
        <label for="name">名前:</label>
        <input type="text" id="name" th:field="*{student.name}" required/>
    </div>
    <div>
        <label for="kana">カナ:</label>
        <input type="text" id="kana" th:field="*{student.kana}" required/>
    </div>
    <div>
        <label for="nickname">ニックネーム:</label>
        <input type="text" id="nickname" th:field="*{student.nickname}" required/>
    </div>
    <div>
        <label for="mailaddress">メールアドレス:</label>
        <input type="text" id="mailaddress" th:field="*{student.mailaddress}" required/>
    </div>
    <div>
        <label for="tiiki">地域:</label>
        <input type="text" id="tiiki" th:field="*{student.tiiki}" required/>
    </div>
    <div>
        <label for="age">年齢:</label>
        <input type="number" id="age" th:field="*{student.age}" />
    </div>
    <div>
        <label for="gender">性別:</label>
        <input type="text" id="gender" th:field="*{student.gender}" />
    </div>
    <div>
        <label for="remark">備考:</label>
        <input type="text" id="remark" th:field="*{student.remark}" />


    </div>
    <div th:each="course,stat : *{studentCourses}">
        <input type="hidden" th:field="*{studentCourses[__${stat.index}__].id}"/>

        <label for="course">受講コース:</label>
        <input type="text" id="course"  th:field="*{studentCourses[__${stat.index}__].course}" />
    </div>
    <div>
        <button type="submit">更新</button>
    </div>
</form>
</body>
</html>
